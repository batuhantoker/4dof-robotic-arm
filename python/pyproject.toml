[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "four-dof-arm"
version = "0.1.0"
description = "Kinematics, trajectory planning, and MuJoCo simulation for 4-DOF and configurable serial arms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.7",
]
simulation = [
    "mujoco>=3.1",
    "Pillow>=9",
]
dev = [
    "build>=1.2",
    "matplotlib>=3.7",
    "mujoco>=3.1",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.12.5",
]

[project.scripts]
four-dof-arm-demo = "four_dof_arm.cli:demo"
four-dof-arm-mujoco = "four_dof_arm.cli:mujoco"
serial-arm-analyze = "four_dof_arm.serial_arm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"four_dof_arm.mujoco_sim" = ["mujoco_model.xml"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["four_dof_arm"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src/four_dof_arm"]
show_error_codes = true
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "mpl_toolkits.*", "mujoco", "mujoco.*"]
ignore_missing_imports = true
